<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Check</title>
  <style>
    body { font-family: sans-serif; padding: 20px 16px; margin: 0; max-width: 480px; margin: auto; }
    h1 { text-align: center; margin-top: 0; }
    .btn { display: block; text-align: center; font-size: 18px; padding: 14px; margin: 12px 0;
           border-radius: 12px; background: #1a73e8; color: white; border: none; width: 100%; cursor: pointer; }
    .btn.green { background: #188038; }
    .btn.gray { background: #666; font-size: 14px; padding: 10px; }
    input[type=password] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    #preview { display: none; width: 100%; margin-top: 12px; border-radius: 12px; }
    #status { text-align: center; color: #555; margin: 10px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    td { padding: 8px 6px; border-bottom: 1px solid #ddd; font-size: 15px; }
    td:last-child { text-align: right; font-weight: bold; }
    .missing { color: #b00020; font-weight: normal; }
    details { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Label Check</h1>

  <details id="keybox">
    <summary>API key setup</summary>
    <p style="font-size:14px">Paste your Gemini key once. It is stored only on this phone.</p>
    <input id="keyInput" type="password" placeholder="Paste API key here">
    <button class="btn gray" id="saveKey">Save key</button>
  </details>

  <label class="btn" for="cam">1. Take photo of label</label>
  <input id="cam" type="file" accept="image/*" capture="environment" style="display:none">
  <img id="preview" alt="Photo of the label">

  <button class="btn green" id="readBtn" style="display:none">2. Read label</button>
  <p id="status"></p>
  <div id="result"></div>

  <script>
    // If you ever get a "model not found" error, change this one word:
    const MODEL = 'gemini-3.5-flash-lite';

    const FIELDS = [
      ['serving_size', 'Serving size', ''],
      ['servings_per_container', 'Servings per container', ''],
      ['calories', 'Calories', ''],
      ['total_fat_g', 'Total fat', ' g'],
      ['saturated_fat_g', 'Saturated fat', ' g'],
      ['trans_fat_g', 'Trans fat', ' g'],
      ['polyunsaturated_fat_g', 'Polyunsaturated fat', ' g'],
      ['monounsaturated_fat_g', 'Monounsaturated fat', ' g'],
      ['cholesterol_mg', 'Cholesterol', ' mg'],
      ['sodium_mg', 'Sodium', ' mg'],
      ['total_carbohydrate_g', 'Total carbohydrate', ' g'],
      ['dietary_fiber_g', 'Dietary fiber', ' g'],
      ['total_sugars_g', 'Total sugars', ' g'],
      ['added_sugars_g', 'Added sugars', ' g'],
      ['protein_g', 'Protein', ' g'],
      ['vitamin_d_mcg', 'Vitamin D', ' mcg'],
      ['calcium_mg', 'Calcium', ' mg'],
      ['iron_mg', 'Iron', ' mg'],
      ['potassium_mg', 'Potassium', ' mg']
    ];

    const PROMPT =
      'You are reading a US Nutrition Facts label from a photo. Return ONLY a JSON object ' +
      'with exactly these keys: serving_size (string, as printed), servings_per_container (number or string), ' +
      'calories, total_fat_g, saturated_fat_g, trans_fat_g, polyunsaturated_fat_g, monounsaturated_fat_g, ' +
      'cholesterol_mg, sodium_mg, total_carbohydrate_g, dietary_fiber_g, total_sugars_g, added_sugars_g, ' +
      'protein_g, vitamin_d_mcg, calcium_mg, iron_mg, potassium_mg. ' +
      'All values are numbers per ONE serving, in the unit named by the key. ' +
      'If a value is not printed on the label, use null. Do not guess or calculate missing values. ' +
      'Read the numbers exactly as printed.';

    const cam = document.getElementById('cam');
    const preview = document.getElementById('preview');
    const readBtn = document.getElementById('readBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const keyInput = document.getElementById('keyInput');
    let currentFile = null;

    function getKey() { try { return localStorage.getItem('gemini_key') || ''; } catch (e) { return ''; } }
    if (!getKey()) document.getElementById('keybox').open = true;

    document.getElementById('saveKey').addEventListener('click', function () {
      const k = keyInput.value.trim();
      if (!k) { statusEl.textContent = 'Please paste a key first.'; return; }
      try { localStorage.setItem('gemini_key', k); } catch (e) {}
      keyInput.value = '';
      document.getElementById('keybox').open = false;
      statusEl.textContent = 'Key saved on this phone.';
    });

    cam.addEventListener('change', function () {
      currentFile = cam.files[0];
      if (!currentFile) return;
      preview.src = URL.createObjectURL(currentFile);
      preview.style.display = 'block';
      readBtn.style.display = 'block';
      resultEl.innerHTML = '';
      statusEl.textContent = 'Photo ready. Tap "Read label".';
    });

    // Shrink the photo so it uploads fast
    function shrinkToBase64(file) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        img.onload = function () {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    readBtn.addEventListener('click', async function () {
      const key = getKey();
      if (!key) { statusEl.textContent = 'Open "API key setup" and save your key first.'; document.getElementById('keybox').open = true; return; }
      if (!currentFile) return;

      readBtn.disabled = true;
      statusEl.textContent = 'Reading label... (5-15 seconds)';
      resultEl.innerHTML = '';

      try {
        const b64 = await shrinkToBase64(currentFile);
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent';
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({
            contents: [{ parts: [{ text: PROMPT }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0 }
          })
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error((data.error && data.error.message) || ('HTTP ' + resp.status));
        }
        const text = data.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('');
        const nutrients = JSON.parse(text);
        showResult(nutrients);
        statusEl.textContent = 'Done. Please compare with the real label to check accuracy.';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      }
      readBtn.disabled = false;
    });

    function showResult(n) {
      let html = '<table>';
      FIELDS.forEach(function (f) {
        const v = n[f[0]];
        const shown = (v === null || v === undefined)
          ? '<span class="missing">not found</span>'
          : v + f[2];
        html += '<tr><td>' + f[1] + '</td><td>' + shown + '</td></tr>';
      });
      html += '</table>';
      resultEl.innerHTML = html;
    }
  </script>
</body>
</html>
