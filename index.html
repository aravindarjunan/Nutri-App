<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Check</title>
  <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFF1B8">
<style>
  body { font-family: sans-serif; padding: 16px; margin: 0 auto; max-width: 480px; }
  h1 { text-align: center; margin: 0 0 12px; }
  .btn { display: block; text-align: center; font-size: 18px; padding: 14px; margin: 10px 0;
         border-radius: 12px; background: #1a73e8; color: #fff; border: none; width: 100%;
         cursor: pointer; box-sizing: border-box; }
  .btn.green { background: #188038; }
  .btn.gray { background: #666; font-size: 14px; padding: 10px; }
  .btn:disabled { opacity: .5; }
  input[type=password] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
  #thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #thumbs img { width: 30%; border-radius: 8px; border: 1px solid #ccc; }
  #status { text-align: center; color: #555; margin: 10px 0; }
  .verdict { border-radius: 14px; padding: 18px; text-align: center; color: #fff;
             font-size: 28px; font-weight: bold; margin-top: 12px; }
  .verdict small { display: block; font-size: 13px; font-weight: normal; margin-top: 6px; }
  .v-green { background: #188038; }
  .v-yellow { background: #f2b600; color: #222; }
  .v-red { background: #c5221f; }
  ul { padding-left: 0; list-style: none; }
  li.reason { padding: 8px 10px; margin: 6px 0; border-radius: 8px; font-size: 15px; }
  li.red { background: #fce8e6; border-left: 6px solid #c5221f; }
  li.yellow { background: #fef7e0; border-left: 6px solid #f2b600; }
  h3 { margin: 18px 0 6px; }
  .ing { line-height: 2; font-size: 15px; }
  .ing span { padding: 2px 5px; border-radius: 6px; }
  .ing .red { background: #f9c7c4; }
  .ing .yellow { background: #fde9a8; }
  .badge { display: inline-block; background: #e6f4ea; color: #137333; padding: 5px 10px;
           border-radius: 14px; margin: 3px; font-size: 14px; }
  .note { color: #666; font-size: 13px; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 7px 6px; border-bottom: 1px solid #ddd; font-size: 14px; }
  td:last-child { text-align: right; font-weight: bold; }
  .missing { color: #b00020; font-weight: normal; }
  details { margin: 8px 0; }
</style>
</head>
<body>
  <h1>Label Check</h1>

  <details id="keybox">
    <summary>API key setup</summary>
    <p style="font-size:14px">Paste your Gemini key once. It is stored only on this phone.</p>
    <input id="keyInput" type="password" placeholder="Paste API key here">
    <button class="btn gray" id="saveKey">Save key</button>
  </details>

  <label class="btn" for="cam">1. Add photo (nutrition panel, then ingredients)</label>
  <input id="cam" type="file" accept="image/*" capture="environment" style="display:none">
  <div id="thumbs"></div>
  <button class="btn gray" id="clearBtn" style="display:none">Clear photos</button>

  <button class="btn green" id="readBtn" style="display:none">2. Check product</button>
  <p id="status"></p>
  <div id="result"></div>

<script>
  // If you ever get a "model not found" error, change this one word:
  const MODEL = 'gemini-3.5-flash-lite';

  // ===== YOUR RULES (edit the numbers here) =====
  // red/yellow = the verdict turns that color when the value is ABOVE the number.
  // null = that color is never used for this nutrient.
  const RULES = [
    { key: 'trans_fat_g',     name: 'Trans fat',     unit: 'g',  yellow: null, red: 0   },
    { key: 'saturated_fat_g', name: 'Saturated fat', unit: 'g',  yellow: 2,    red: 3   },
    { key: 'sodium_mg',       name: 'Sodium',        unit: 'mg', yellow: 150,  red: 400 },
    { key: 'added_sugars_g',  name: 'Added sugars',  unit: 'g',  yellow: 3,    red: 6   },
    { key: 'cholesterol_mg',  name: 'Cholesterol',   unit: 'mg', yellow: 100,  red: null }
  ];

  // ===== INGREDIENT WATCHLIST (add or remove lines here) =====
  const WATCHLIST = [
    { level: 'red', why: 'Hydrogenated oil (trans fat)', re: /hydrogenated/i },
    { level: 'red', why: 'Palm oil', re: /\bpalm\b|palmolein/i },
    { level: 'red', why: 'Vegetable / seed oil', re: /vegetable oil|soybean oil|canola oil|rapeseed oil|corn oil|cottonseed oil|sunflower oil|safflower oil|grapeseed oil|rice bran oil|seed oil/i },
    { level: 'red', why: 'High-fructose corn syrup', re: /high[- ]fructose|hfcs/i },
    { level: 'red', why: 'Artificial sweetener', re: /aspartame|sucralose|acesulfame|saccharin|neotame|advantame/i },
    { level: 'red', why: 'Artificial color', re: /artificial colou?r|fd&c|\b(red|yellow|blue|green)\s*(no\.?\s*|#)?\d+\b/i },
    { level: 'red', why: 'Preservative (BHA / BHT / TBHQ)', re: /\bbha\b|\bbht\b|tbhq|butylated/i },
    { level: 'red', why: 'Nitrite / nitrate', re: /nitrite|nitrate/i },
    { level: 'red', why: 'Bromate / brominated oil', re: /bromate|brominated/i },
    { level: 'yellow', why: 'Carrageenan', re: /carrageenan/i },
    { level: 'yellow', why: 'Maltodextrin', re: /maltodextrin/i },
    { level: 'yellow', why: 'MSG / flavor enhancer', re: /monosodium glutamate|\bmsg\b|inosinate|guanylate/i },
    { level: 'yellow', why: 'Titanium dioxide', re: /titanium dioxide/i },
    { level: 'yellow', why: 'Preservative (benzoate / sorbate)', re: /sodium benzoate|potassium sorbate/i }
  ];

  // For the full nutrient table
  const FIELDS = [
    ['serving_size', 'Serving size', ''], ['servings_per_container', 'Servings per container', ''],
    ['calories', 'Calories', ''], ['total_fat_g', 'Total fat', ' g'],
    ['saturated_fat_g', 'Saturated fat', ' g'], ['trans_fat_g', 'Trans fat', ' g'],
    ['polyunsaturated_fat_g', 'Polyunsaturated fat', ' g'], ['monounsaturated_fat_g', 'Monounsaturated fat', ' g'],
    ['cholesterol_mg', 'Cholesterol', ' mg'], ['sodium_mg', 'Sodium', ' mg'],
    ['total_carbohydrate_g', 'Total carbohydrate', ' g'], ['dietary_fiber_g', 'Dietary fiber', ' g'],
    ['total_sugars_g', 'Total sugars', ' g'], ['added_sugars_g', 'Added sugars', ' g'],
    ['protein_g', 'Protein', ' g'], ['vitamin_d_mcg', 'Vitamin D', ' mcg'],
    ['calcium_mg', 'Calcium', ' mg'], ['iron_mg', 'Iron', ' mg'], ['potassium_mg', 'Potassium', ' mg']
  ];

  const PROMPT =
    'You are reading a food product from one to three photos of the SAME product. ' +
    'The photos may show the US Nutrition Facts label, the ingredients list, or both. ' +
    'Return ONLY a JSON object with exactly these keys: serving_size (string, as printed), ' +
    'servings_per_container (number or string), calories, total_fat_g, saturated_fat_g, trans_fat_g, ' +
    'polyunsaturated_fat_g, monounsaturated_fat_g, cholesterol_mg, sodium_mg, total_carbohydrate_g, ' +
    'dietary_fiber_g, total_sugars_g, added_sugars_g, protein_g, vitamin_d_mcg, calcium_mg, iron_mg, ' +
    'potassium_mg, ingredients. All nutrient values are numbers per ONE serving, in the unit named by the key. ' +
    'If a nutrient is not printed, use null. Do not guess or calculate missing values. ' +
    '"ingredients" is an array of strings, one per ingredient exactly as printed, in order ' +
    '(split on commas; list ingredients inside parentheses as their own items). ' +
    'If no ingredients list is visible in any photo, use null for ingredients.';

  const cam = document.getElementById('cam');
  const thumbs = document.getElementById('thumbs');
  const readBtn = document.getElementById('readBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const keyInput = document.getElementById('keyInput');
  let photos = [];

  function getKey() { try { return localStorage.getItem('gemini_key') || ''; } catch (e) { return ''; } }
  if (!getKey()) document.getElementById('keybox').open = true;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) {
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const x = parseFloat(v); return isNaN(x) ? null : x; }
    return null;
  }

  document.getElementById('saveKey').addEventListener('click', function () {
    const k = keyInput.value.trim();
    if (!k) { statusEl.textContent = 'Please paste a key first.'; return; }
    try { localStorage.setItem('gemini_key', k); } catch (e) {}
    keyInput.value = '';
    document.getElementById('keybox').open = false;
    statusEl.textContent = 'Key saved on this phone.';
  });

  function renderThumbs() {
    thumbs.innerHTML = '';
    photos.forEach(function (p) {
      const img = document.createElement('img');
      img.src = p.url;
      thumbs.appendChild(img);
    });
    readBtn.style.display = photos.length ? 'block' : 'none';
    clearBtn.style.display = photos.length ? 'block' : 'none';
  }

  cam.addEventListener('change', function () {
    const f = cam.files[0];
    if (!f) return;
    if (photos.length >= 3) {
      statusEl.textContent = 'Maximum 3 photos. Tap "Clear photos" to start over.';
    } else {
      photos.push({ file: f, url: URL.createObjectURL(f) });
      resultEl.innerHTML = '';
      statusEl.textContent = photos.length + ' photo(s) added. Add the ingredients photo, or tap "Check product".';
      renderThumbs();
    }
    cam.value = '';
  });

  clearBtn.addEventListener('click', function () {
    photos = [];
    renderThumbs();
    resultEl.innerHTML = '';
    statusEl.textContent = '';
  });

  function shrinkToBase64(file) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  readBtn.addEventListener('click', async function () {
    const key = getKey();
    if (!key) { statusEl.textContent = 'Open "API key setup" and save your key first.'; document.getElementById('keybox').open = true; return; }
    if (!photos.length) return;

    readBtn.disabled = true;
    resultEl.innerHTML = '';
    let secs = 0;
    statusEl.textContent = 'Checking product... 0s';
    const timer = setInterval(function () { secs++; statusEl.textContent = 'Checking product... ' + secs + 's'; }, 1000);
    const controller = new AbortController();
    const killer = setTimeout(function () { controller.abort(); }, 90000);

    try {
      const images = await Promise.all(photos.map(function (p) { return shrinkToBase64(p.file); }));
      const parts = [{ text: PROMPT }].concat(images.map(function (b64) {
        return { inline_data: { mime_type: 'image/jpeg', data: b64 } };
      }));
      const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent';
      const resp = await fetch(url, {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0 }
        })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + resp.status));
      const text = data.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('');
      const n = JSON.parse(text);
      showResult(n);
      statusEl.textContent = 'Done in ' + secs + 's. Compare with the real package if anything looks odd.';
    } catch (err) {
      statusEl.textContent = (err.name === 'AbortError')
        ? 'Timed out after 90 seconds. Try again.'
        : 'Error: ' + err.message;
    }
    clearInterval(timer);
    clearTimeout(killer);
    readBtn.disabled = false;
  });

  function evaluate(n) {
    const reasons = [];
    const notes = [];

    RULES.forEach(function (r) {
      const v = num(n[r.key]);
      if (v === null) { notes.push(r.name + ' not found on the photos'); return; }
      if (r.red !== null && v > r.red) {
        reasons.push({ level: 'red', text: r.name + ': ' + v + ' ' + r.unit + ' (limit ' + r.red + ' ' + r.unit + ')' });
      } else if (r.yellow !== null && v > r.yellow) {
        reasons.push({ level: 'yellow', text: r.name + ': ' + v + ' ' + r.unit + ' (watch above ' + r.yellow + ' ' + r.unit + ')' });
      }
    });

    const ingredients = Array.isArray(n.ingredients) ? n.ingredients.map(String) : null;
    const flagged = {};   // ingredient text -> level
    if (ingredients) {
      const seen = {};
      ingredients.forEach(function (ing) {
        WATCHLIST.forEach(function (w) {
          if (w.re.test(ing)) {
            if (flagged[ing] !== 'red') flagged[ing] = w.level;
            const id = w.why + '|' + ing;
            if (!seen[id]) {
              seen[id] = true;
              reasons.push({ level: w.level, text: 'Ingredient: ' + ing + ' (' + w.why + ')' });
            }
          }
        });
      });
    } else {
      notes.push('Ingredients not checked. Add a photo of the ingredients list.');
    }

    let level = 'green';
    if (reasons.some(function (r) { return r.level === 'yellow'; })) level = 'yellow';
    if (reasons.some(function (r) { return r.level === 'red'; })) level = 'red';
    return { level: level, reasons: reasons, notes: notes, ingredients: ingredients, flagged: flagged };
  }

  function badgesFor(n) {
    const b = [];
    const protein = num(n.protein_g), fiber = num(n.dietary_fiber_g);
    if (protein !== null && protein >= 20) b.push('Excellent protein (' + protein + ' g)');
    else if (protein !== null && protein >= 10) b.push('Good protein (' + protein + ' g)');
    if (fiber !== null && fiber >= 3) b.push('Good fiber (' + fiber + ' g)');
    [['vitamin_d_mcg', 'Vitamin D', 2], ['calcium_mg', 'Calcium', 130],
     ['iron_mg', 'Iron', 1.8], ['potassium_mg', 'Potassium', 470]].forEach(function (x) {
      const v = num(n[x[0]]);
      if (v !== null && v >= x[2]) b.push(x[1] + ' source');
    });
    return b;
  }

  function showResult(n) {
    const e = evaluate(n);
    const label = { green: 'GOOD', yellow: 'OK - WATCH', red: 'NOT GOOD' }[e.level];
    const badges = badgesFor(n);
    const protein = num(n.protein_g), fiber = num(n.dietary_fiber_g);
    const star = e.level === 'green' && ((protein !== null && protein >= 10) || (fiber !== null && fiber >= 3));

    let html = '<div class="verdict v-' + e.level + '">' + (star ? '&#11088; ' : '') + label +
      (e.ingredients ? '' : '<small>nutrients only - ingredients not checked</small>') + '</div>';

    if (e.reasons.length) {
      html += '<h3>Why</h3><ul>';
      e.reasons.forEach(function (r) { html += '<li class="reason ' + r.level + '">' + esc(r.text) + '</li>'; });
      html += '</ul>';
    }

    if (e.ingredients) {
      html += '<h3>Ingredients</h3><div class="ing">';
      html += e.ingredients.map(function (ing) {
        const lv = e.flagged[ing];
        return lv ? '<span class="' + lv + '">' + esc(ing) + '</span>' : esc(ing);
      }).join(', ');
      html += '</div>';
    }

    if (badges.length) {
      html += '<h3>Good to know</h3>';
      badges.forEach(function (x) { html += '<span class="badge">' + esc(x) + '</span>'; });
    }

    e.notes.forEach(function (x) { html += '<p class="note">' + esc(x) + '</p>'; });
    html += '<p class="note">Verdict is per serving: ' + esc(n.serving_size || 'serving size not found') + '.</p>';

    html += '<details><summary>Show all nutrients</summary><table>';
    FIELDS.forEach(function (f) {
      const v = n[f[0]];
      const shown = (v === null || v === undefined) ? '<span class="missing">not found</span>' : esc(v) + f[2];
      html += '<tr><td>' + f[1] + '</td><td>' + shown + '</td></tr>';
    });
    html += '</table></details>';

    resultEl.innerHTML = html;
  }
</script>
</body>
</html>
