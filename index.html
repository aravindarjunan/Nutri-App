<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Check</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 24px 16px; margin: 0; }
    h1 { margin-top: 0; }
    .btn {
      display: inline-block; font-size: 20px; padding: 16px 28px;
      border-radius: 12px; background: #1a73e8; color: white; cursor: pointer;
    }
    #preview { display: none; max-width: 100%; margin-top: 20px; border-radius: 12px; }
    #info { margin-top: 12px; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Label Check</h1>

  <label class="btn" for="cam">Take photo of label</label>
  <input id="cam" type="file" accept="image/*" capture="environment" style="display:none">

  <p id="info">Tap the button to open your camera.</p>
  <img id="preview" alt="Photo of the label">

  <script>
    const cam = document.getElementById('cam');
    const preview = document.getElementById('preview');
    const info = document.getElementById('info');

    cam.addEventListener('change', function () {
      const file = cam.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      info.textContent = 'Photo ready (' + Math.round(file.size / 1024) + ' KB). Reading it comes in the next step.';
    });
  </script>
</body>
</html>
